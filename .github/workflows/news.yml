name: Osveži novice

on:
  schedule:
    # REZERVA, ne glavni urnik.
    # Glavno prozilo je zunanji urnik (cron-job.org), ki klice
    # workflow_dispatch prek API-ja - ta pot obide GitHubovo pocasno
    # cron vrsto in se zazene skoraj takoj.
    # Ta vnos ostane samo za primer, da zunanji urnik odpove.
    # Minuti 13 in 43 sta izbrani namenoma: zagoni ob polni in
    # polovicni uri padejo v val, ki ga GitHub obdeluje z zamikom.
    - cron: "13,43 * * * *"

  # To je vstopna tocka za zunanji urnik (in za gumb "Run workflow").
  workflow_dispatch:

  # Ob vsakem pushu osveži takoj, da lahko preverjaš spremembe.
  push:
    branches: [main, master]

# Potrebno, da lahko workflow zapiše news.json nazaj v repozitorij.
permissions:
  contents: write

# Zagoni naj se ne prekrivajo. Prej je bilo "cancel-in-progress: true",
# kar je starejsi zagon PREKINILO - in prekinjen zagon se pokaze kot
# rdeci krizec, ceprav ni slo nic narobe. Zagon traja ~25 s, zato je
# bolje, da nov pocaka na prejsnjega.
concurrency:
  group: novice
  cancel-in-progress: false

jobs:
  zberi-novice:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Prevzemi repozitorij
        uses: actions/checkout@v4

      - name: Nastavi Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zberi novice in slike
        run: node fetch-news.js
        env:
          # Neobvezno. Ce je Secret nastavljen, prevajanje tece prek
          # DeepL (bistveno boljsa slovenscina). Ce ni, se samodejno
          # uporabi Google - vse deluje enako, le prevod je slabsi.
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}

      - name: Shrani news.json, če se je spremenil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Najprej dodamo v pripravo (staging).
          # Pozor: "git diff" sam po sebi NE vidi novih datotek,
          # zato je nujno najprej "git add", nato "--cached".
          git add news.json

          if git diff --cached --quiet; then
            echo "Ni sprememb v novicah."
            exit 0
          fi

          git commit -m "Samodejna osvežitev novic"

          # Če je medtem nekdo drug potisnil spremembo, poskusi znova.
          for i in 1 2 3; do
            if git push; then
              echo "Potisnjeno."
              exit 0
            fi
            echo "Push ni uspel, poskušam znova ($i) ..."
            git pull --rebase
          done

          echo "Push ni uspel po treh poskusih."
          exit 1
