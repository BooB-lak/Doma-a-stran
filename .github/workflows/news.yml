name: Osveži novice

on:
  schedule:
    # Vsakih 10 minut. Opomba: GitHub cron ni natančen na minuto -
    # ob veliki obremenitvi zna zamuditi 5-20 minut. To je GitHubova
    # omejitev, ne napaka v nastavitvi.
    - cron: "*/10 * * * *"

  # Omogoča ročni zagon iz zavihka "Actions" (gumb "Run workflow").
  workflow_dispatch:

  # Ob vsakem pushu osveži takoj, da lahko preverjaš spremembe.
  push:
    branches: [main, master]

# Potrebno, da lahko workflow zapiše news.json nazaj v repozitorij.
permissions:
  contents: write

# Če se prejšnji zagon še ni končal, ga ne podvajaj.
concurrency:
  group: novice
  cancel-in-progress: true

jobs:
  zberi-novice:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Prevzemi repozitorij
        uses: actions/checkout@v4

      - name: Nastavi Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zberi novice in slike
        run: node fetch-news.js

      - name: Shrani news.json, če se je spremenil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- news.json; then
            echo "Ni sprememb v novicah."
            exit 0
          fi

          git add news.json
          git commit -m "Samodejna osvežitev novic"

          # Če je medtem nekdo drug potisnil spremembo, poskusi znova.
          for i in 1 2 3; do
            if git push; then
              echo "Potisnjeno."
              exit 0
            fi
            echo "Push ni uspel, poskušam znova ($i) ..."
            git pull --rebase
          done

          echo "Push ni uspel po treh poskusih."
          exit 1
